<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ELIO | Automation Engineering</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

*{ box-sizing:border-box; margin:0; padding:0; }
html, body{ overflow-x:hidden; }

body{
  --bg-base:#0a0a18; --ink:#f4f3ff; --ink-dim:rgba(244,243,255,0.62);
  --glass:rgba(255,255,255,0.07); --glass-2:rgba(255,255,255,0.12); --glass-border:rgba(255,255,255,0.16);
  --accent-a:#8b5cf6; --accent-b:#ec4899; --accent-c:#22d3ee;
  background:var(--bg-base); min-height:100vh; width:100%; font-family:'Outfit', sans-serif; color:var(--ink); position:relative;
}

.blob{ position:fixed; border-radius:50%; filter:blur(90px); opacity:0.55; z-index:0; pointer-events:none; }
.blob-1{ width:420px; height:420px; background:radial-gradient(circle, var(--accent-a), transparent 70%); top:-120px; left:-100px; animation:float1 16s ease-in-out infinite alternate; }
.blob-2{ width:380px; height:380px; background:radial-gradient(circle, var(--accent-b), transparent 70%); top:30%; right:-140px; animation:float2 20s ease-in-out infinite alternate; }
.blob-3{ width:360px; height:360px; background:radial-gradient(circle, var(--accent-c), transparent 70%); bottom:-140px; left:10%; animation:float3 18s ease-in-out infinite alternate; }
@keyframes float1{ from{ transform:translate(0,0) scale(1); } to{ transform:translate(60px,50px) scale(1.15); } }
@keyframes float2{ from{ transform:translate(0,0) scale(1); } to{ transform:translate(-50px,60px) scale(1.1); } }
@keyframes float3{ from{ transform:translate(0,0) scale(1); } to{ transform:translate(40px,-40px) scale(1.12); } }

.particles-container { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.particle { position: absolute; width: 4px; height: 4px; background: var(--accent-c); border-radius: 50%; opacity: 0; animation: floatUp 8s infinite linear; box-shadow: 0 0 8px var(--accent-c); }
.particle:nth-child(1) { left: 15%; top: 80%; animation-duration: 7s; animation-delay: 0s; }
.particle:nth-child(2) { left: 85%; top: 90%; animation-duration: 9s; animation-delay: 2s; }
.particle:nth-child(3) { left: 50%; top: 85%; animation-duration: 6s; animation-delay: 4s; background: var(--accent-a); box-shadow: 0 0 8px var(--accent-a); }
.particle:nth-child(4) { left: 30%; top: 95%; animation-duration: 10s; animation-delay: 1s; }
@keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 0; } 20% { opacity: 0.8; } 80% { opacity: 0.8; } 100% { transform: translateY(-400px) scale(0); opacity: 0; } }

/* 2 Nút nổi cố định ở HAI GÓC TRÊN CÙNG */
.floating-dock-top {
  position: fixed;
  top: 20px;
  left: 20px;
  right: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 999;
  pointer-events: none;
  max-width: 480px;
  margin: 0 auto;
}
.float-action-btn {
  pointer-events: auto;
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px;
  border-radius: 99px;
  color: #fff;
  font-family: 'Outfit', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  text-decoration: none;
  transition: transform 0.25s ease, filter 0.25s ease;
}
.float-action-btn svg { width: 15px; height: 15px; color: #fff; }
.float-action-btn:hover {
  transform: translateY(3px) scale(1.05);
  filter: brightness(1.15);
}

/* Hiệu ứng màu sắc nút Lưu danh bạ (Góc trái) */
#saveContactBtnTop {
  background: linear-gradient(135deg, var(--accent-c), #3b82f6);
  box-shadow: 0 4px 15px rgba(34,211,238,0.4);
  animation: pulse-glow-cyan 2.5s infinite alternate;
}
/* Hiệu ứng màu sắc nút Chia sẻ (Góc phải) */
#shareBtnTop {
  background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
  box-shadow: 0 4px 15px rgba(139,92,246,0.4);
  animation: pulse-glow-purple 2.5s infinite alternate;
}

@keyframes pulse-glow-cyan {
  0% { box-shadow: 0 4px 12px rgba(34,211,238,0.4); }
  100% { box-shadow: 0 4px 22px rgba(34,211,238,0.8); }
}
@keyframes pulse-glow-purple {
  0% { box-shadow: 0 4px 12px rgba(139,92,246,0.4); }
  100% { box-shadow: 0 4px 22px rgba(236,72,153,0.8); }
}

.cover-wrap{ position:relative; z-index:1; max-width:440px; margin:20px auto 0; padding:0 20px; }
.cover{ position:relative; width:100%; aspect-ratio:16/10; overflow:hidden; border-radius:34px; background:var(--glass) center/cover no-repeat; border:1px solid var(--glass-border); box-shadow:0 20px 50px -20px rgba(0,0,0,0.6); opacity:0; animation:coverIn 0.9s cubic-bezier(.22,1,.36,1) forwards; }
@keyframes coverIn{ from{ opacity:0; transform:scale(0.94) translateY(-10px); } to{ opacity:1; transform:scale(1) translateY(0); } }
.cover-placeholder{ position:absolute; inset:0; background: radial-gradient(circle at 30% 25%, rgba(139,92,246,0.35) 0%, transparent 55%), radial-gradient(circle at 75% 70%, rgba(236,72,153,0.28) 0%, transparent 55%), radial-gradient(circle at 50% 100%, rgba(34,211,238,0.22) 0%, transparent 60%); }
.cover-overlay{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,10,24,0.05) 0%, rgba(10,10,24,0.55) 100%); }

.content{ position:relative; z-index:1; max-width:440px; margin:0 auto; padding:0 24px 80px; display:flex; flex-direction:column; align-items:center; }

.avatar-ring{ position:relative; z-index:2; width:118px; height:118px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin-top:-56px; opacity:0; animation:fadeUp 0.7s ease forwards 0.05s, floatY 4.5s ease-in-out infinite 0.9s; cursor: pointer; }
@keyframes floatY{ 0%, 100%{ transform:translateY(0); } 50%{ transform:translateY(-7px); } }
.avatar-ring::before{ content:""; position:absolute; inset:0; border-radius:50%; background:conic-gradient(from 0deg, var(--accent-a), var(--accent-b), var(--accent-c), var(--accent-a)); animation:spin 8s linear infinite; opacity:0.9; filter:blur(0.5px); }
.avatar{ position:relative; z-index:1; width:102px; height:102px; border-radius:50%; background:var(--bg-base) center/cover no-repeat; border:3px solid var(--bg-base); display:flex; align-items:center; justify-content:center; overflow:hidden; }
.avatar-initial{ font-family:'Outfit', sans-serif; font-size:38px; font-weight:700; background:linear-gradient(135deg, var(--accent-a), var(--accent-c)); -webkit-background-clip:text; background-clip:text; color:transparent; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.name{ font-family:'Outfit', sans-serif; font-size:38px; font-weight:800; line-height:1.1; margin-top:18px; background:linear-gradient(90deg, var(--accent-a), var(--accent-b) 55%, var(--accent-c)); -webkit-background-clip:text; background-clip:text; color:transparent; opacity:0; animation:fadeUp 0.7s ease forwards; animation-delay:0.14s; }
.fullname{ font-family:'Outfit', sans-serif; font-weight:500; font-size:15px; color:var(--ink-dim); margin-top:6px; opacity:0; animation:fadeUp 0.7s ease forwards; animation-delay:0.2s; }
.role-line{ font-size:13.5px; font-weight:600; color:var(--ink); margin-top:10px; text-align:center; }
.org-line{ font-size:13px; color:var(--ink-dim); margin-top:2px; text-align:center; }

.tagline{ margin-top:12px; font-size:13.5px; color:var(--ink-dim); text-align:center; opacity:0; animation:fadeUp 0.7s ease forwards; animation-delay:0.24s; min-height: 20px;}
.tagline-placeholder{ font-family:'JetBrains Mono', monospace; font-size:11.5px; color:rgba(244,243,255,0.32); }
.typewriter-cursor { animation: blink 1s step-end infinite; color: var(--accent-c); font-weight: bold; }
@keyframes blink { 50% { opacity: 0; } }

.quick-row{ display:flex; gap:14px; margin-top:20px; opacity:0; animation:fadeUp 0.7s ease forwards; animation-delay:0.28s; }
.quick-icon{ width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--ink); background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--glass-border); text-decoration:none; transition:transform 0.2s ease, background 0.2s ease; }
.quick-icon:hover, .quick-icon:active{ transform:translateY(-3px); background:var(--glass-2); box-shadow: 0 4px 10px rgba(255,255,255,0.1); }
.quick-icon svg{ width:16px; height:16px; }

.hairline{ width:100%; height:1px; background:linear-gradient(90deg, transparent, var(--glass-border), transparent); margin:28px 0 24px; opacity:0; animation:fadeUp 0.7s ease forwards; animation-delay:0.32s; }

.contact-btn{ position:relative; overflow:hidden; width:100%; display:flex; align-items:center; justify-content:center; gap:8px; padding:15px 18px; margin-bottom:12px; border-radius:20px; background:linear-gradient(120deg, var(--accent-a), var(--accent-b)); color:#fff; font-weight:600; font-size:14.5px; text-decoration:none; letter-spacing:0.1px; box-shadow:0 12px 28px -12px rgba(139,92,246,0.55); opacity:0; animation:fadeUp 0.7s ease forwards; animation-delay:0.36s; transition:transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease; cursor: pointer; border: none; }
.contact-btn::after{ content:""; position:absolute; top:0; left:-60%; width:40%; height:100%; background:linear-gradient(120deg, transparent, rgba(255,255,255,0.45), transparent); transform:skewX(-20deg); transition:left 0.6s ease; }
.contact-btn:hover::after, .contact-btn:active::after{ left:130%; }
.contact-btn:active{ transform:scale(0.98); }
.contact-btn:hover{ transform:translateY(-2px); filter:brightness(1.08); }
.contact-btn:hover .contact-arrow{ transform:translate(2px,-2px); }
.contact-btn svg{ width:16px; height:16px; }
.contact-arrow{ transition:transform 0.25s ease; width:14px; height:14px; }

.info-rows{ width:100%; background:var(--glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--glass-border); border-radius:20px; margin-bottom:28px; overflow:hidden; opacity:0; animation:fadeUp 0.7s ease forwards; animation-delay:0.4s; }
.info-row{ display:flex; align-items:center; gap:13px; width:100%; padding:14px 18px; text-decoration:none; color:var(--ink); border-bottom:1px solid var(--glass-border); transition:background 0.2s ease; cursor:pointer;}
.info-row:last-child{ border-bottom:none; }
.info-row:hover, .info-row:active{ background:rgba(255,255,255,0.06); }
.info-icon{ width:28px; height:28px; border-radius:9px; background:transparent; color:var(--accent-c); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.info-icon svg{ width:15px; height:15px; }
.info-label{ font-size:10px; text-transform:uppercase; letter-spacing:0.6px; color:var(--ink-dim); margin-bottom:2px; }
.info-value{ font-size:13.5px; font-weight:500; }

.links{ width:100%; display:flex; flex-direction:column; gap:12px; margin-bottom:32px; }
.link-pill{ position:relative; overflow:hidden; display:flex; align-items:center; gap:14px; width:100%; padding:15px 18px; border-radius:22px; background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--glass-border); text-decoration:none; color:var(--ink); font-family:'Outfit', sans-serif; font-size:15.5px; font-weight:600; opacity:0; animation:fadeUp 0.6s ease forwards; transition:transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease; }
.link-pill::after{ content:""; position:absolute; top:0; left:-60%; width:35%; height:100%; background:linear-gradient(120deg, transparent, rgba(255,255,255,0.18), transparent); transform:skewX(-20deg); transition:left 0.6s ease; }
.link-pill:hover::after, .link-pill:active::after{ left:130%; }
.link-pill:hover{ transform:translateY(-3px) scale(1.01); background:var(--glass-2); box-shadow:0 12px 28px -12px var(--pill-glow, rgba(139,92,246,0.5)); border-color: var(--pill-glow, rgba(255,255,255,0.3)); }
.link-pill:active{ transform:scale(0.98); background:var(--glass-2); }
.pill-icon{ width:38px; height:38px; border-radius:12px; background:var(--pill-color, linear-gradient(135deg, rgba(139,92,246,0.35), rgba(34,211,238,0.35))); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:transform 0.2s ease; }
.pill-icon svg{ width:19px; height:19px; }
.link-pill:hover .pill-icon, .link-pill:active .pill-icon{ transform:scale(1.08) rotate(-4deg); }
.pill-text-icon{ font-size:13px; font-weight:800; font-family:'Outfit',sans-serif; }
.pill-label{ flex:1; }
.pill-arrow{ color:var(--ink-dim); opacity:0; transform:translate(-2px,2px); transition:opacity 0.2s ease, transform 0.2s ease; width:14px; height:14px; }
.pill-arrow svg { width: 14px; height: 14px; }
.link-pill:hover .pill-arrow, .link-pill:active .pill-arrow{ opacity:1; transform:translate(0,0); color:var(--accent-c); }

.feature-heading{ font-family:'Outfit', sans-serif; font-size:12px; text-transform:uppercase; letter-spacing:2px; color:var(--accent-c); margin: 0 0 12px 10px; align-self: flex-start; font-weight:700;}
.feature-card{ display:flex; align-items:center; gap:14px; width:100%; padding:14px 16px; border-radius:22px; background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--glass-border); text-decoration:none; color:var(--ink); transition:transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease; cursor:pointer;}
.feature-card:hover, .feature-card:active{ transform:translateY(-3px) scale(1.01); background:var(--glass-2); box-shadow:0 10px 25px -10px rgba(34,211,238,0.3); border-color:rgba(34,211,238,0.4); }
.feature-card:active{ transform:scale(0.98); }
.feature-thumb{ width:46px; height:46px; border-radius:12px; background:linear-gradient(135deg, var(--accent-a), var(--accent-c)) center/cover no-repeat; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.feature-thumb svg{ width: 20px; height:20px; color:white; }
.feature-title{ font-family:'Outfit', sans-serif; font-weight:700; font-size:14.5px; }
.feature-sub{ margin-top:3px; font-size:12px; color:var(--ink-dim); line-height:1.35; }

.bio-heading{ font-family:'Outfit', sans-serif; font-weight:700; font-size:13px; letter-spacing:2.5px; background:linear-gradient(90deg, var(--accent-a), var(--accent-c)); -webkit-background-clip:text; background-clip:text; color:transparent; text-align:center; margin:4px 0 18px; }
.bio-card{ width:100%; background:var(--glass); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border:1px solid var(--glass-border); border-radius:28px; padding:30px 24px; margin-bottom:28px; }
.bio-line{ font-family:'Outfit', sans-serif; font-weight:400; font-size:15px; color:var(--ink); text-align:center; line-height:1.65; margin-bottom:18px; }
.bio-quote{ font-family:'Outfit', sans-serif; font-weight:700; font-size:13px; letter-spacing:1.2px; background:linear-gradient(90deg, var(--accent-b), var(--accent-c)); -webkit-background-clip:text; background-clip:text; color:transparent; text-align:center; text-transform:uppercase; }

.msg-heading{ font-family:'Outfit', sans-serif; font-weight:700; font-size:13px; letter-spacing:2.5px; background:linear-gradient(90deg, var(--accent-a), var(--accent-c)); -webkit-background-clip:text; background-clip:text; color:transparent; text-align:center; margin:4px 0 18px; }
.contact-option-box { width: 100%; background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 22px; padding: 20px; margin-bottom: 16px; }
.option-title { font-size: 14px; font-weight: 700; color: var(--accent-c); margin-bottom: 8px; font-family: 'Outfit', sans-serif; display: flex; align-items: center; gap: 8px; }
.option-desc { font-size: 12.5px; color: var(--ink-dim); margin-bottom: 14px; line-height: 1.4; }
.msg-input, .msg-textarea{ width:100%; padding:13px 16px; border-radius:14px; background:rgba(255,255,255,0.05); backdrop-filter:blur(10px); border:1px solid var(--glass-border); color:var(--ink); font-family:'Outfit', sans-serif; font-size:14px; outline:none; transition:border-color 0.2s ease, background 0.2s ease; margin-bottom: 10px; }
.msg-input:focus, .msg-textarea:focus{ border-color:var(--accent-a); background:var(--glass-2); }
.msg-input::placeholder, .msg-textarea::placeholder{ color:var(--ink-dim); }
.msg-textarea{ min-height:90px; resize:vertical; }

.msg-submit{ position:relative; overflow:hidden; width:100%; padding:14px 18px; border-radius:14px; border:none; background:linear-gradient(120deg, var(--accent-a), var(--accent-b)); color:#fff; font-weight:700; font-size:14px; cursor:pointer; box-shadow:0 8px 20px -8px rgba(139,92,246,0.5); transition:transform 0.2s ease, filter 0.2s ease; text-decoration: none; display: flex; align-items: center; justify-content: center; text-align: center; }
.msg-submit:hover{ transform:translateY(-2px); filter:brightness(1.08); }
.msg-submit:active{ transform:scale(0.98); }

.footer-note{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.5px; color:rgba(244,243,255,0.28); text-align: center; margin-top: 20px;}

.modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(10px); z-index:99; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:0.3s ease; padding: 20px; }
.modal-overlay.active{ opacity:1; pointer-events:auto; }
.modal-box{ background:var(--bg-base); border:1px solid var(--glass-border); border-radius:24px; padding:24px; max-width:400px; width:100%; transform:translateY(20px); transition:0.3s cubic-bezier(0.25, 0.8, 0.25, 1); box-shadow:0 25px 50px -12px rgba(0,0,0,0.5); position:relative; }
.modal-overlay.active .modal-box{ transform:translateY(0); }
.close-modal{ position:absolute; top:16px; right:16px; background:var(--glass); border:none; color:white; width:30px; height:30px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:0.2s;}
.close-modal:hover{ background:var(--accent-b); transform:rotate(90deg);}
.modal-content h3{ color:var(--accent-c); margin-bottom:10px; font-size:18px; font-family:'Outfit', sans-serif;}
.modal-content p{ color:var(--ink-dim); font-size:14px; line-height:1.6; margin-bottom:15px; }

.terminal-overlay { position:fixed; inset:0; background:#000; z-index:999; display:none; flex-direction:column; padding:20px; font-family:'JetBrains Mono', monospace; font-size:14px; color:#0f0; }
.terminal-overlay.active { display:flex; }
.terminal-line { margin-bottom: 5px; }

@keyframes fadeUp{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:translateY(0); } }
.reveal{ opacity:0; transform:translateY(28px) scale(0.98); transition:opacity 0.7s cubic-bezier(.22,1,.36,1), transform 0.7s cubic-bezier(.22,1,.36,1); }
.reveal.is-visible{ opacity:1; transform:translateY(0) scale(1); }

@media (prefers-reduced-motion: reduce){
  .blob, .avatar-ring::before, .particle, .cover, .name, .tagline, .quick-row, .hairline, .contact-btn, .info-rows, .link-pill { animation:none !important; opacity:1 !important; transform:none !important; }
  .reveal{ opacity:1; transform:none; transition:none; }
}
@media (max-width:480px){ .content{ padding:0 18px 90px; } .cover-wrap{ padding:0 16px; } .name{ font-size:32px; } }
</style>
</head>
<body>

<!-- 2 NÚT NỔI Ở HAI GÓC TRÊN CÙNG -->
<div class="floating-dock-top">
  <!-- Góc trái: Lưu danh bạ -->
  <a class="float-action-btn" id="saveContactBtnTop" href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
    <span>Lưu bạ</span>
  </a>
  <!-- Góc phải: Chia sẻ -->
  <button class="float-action-btn" id="shareBtnTop" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/></svg>
    <span>Chia sẻ</span>
  </button>
</div>

<div class="particles-container">
  <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
</div>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="terminal-overlay" id="terminal"><div id="term-content"></div></div>
<div class="modal-overlay" id="projectModal">
    <div class="modal-box">
        <button class="close-modal" id="closeModal">✕</button>
        <div class="modal-content" id="modalContent"></div>
    </div>
</div>

<div class="cover-wrap">
  <header class="cover" id="cover">
    <div class="cover-placeholder" id="coverPlaceholder"></div>
    <div class="cover-overlay"></div>
  </header>
</div>

<main class="content">
  <div class="avatar-ring" id="avatarRing" title="Nhấp đúp thử xem!">
    <div class="avatar" id="avatar"></div>
  </div>

  <h1 class="name" id="name"></h1>
  <p class="fullname" id="fullname"></p>
  <p class="role-line" id="roleLine"></p>
  <p class="org-line" id="orgLine"></p>
  <p class="tagline" id="tagline"></p>

  <nav class="quick-row" id="quickRow"></nav>
  <div class="hairline"></div>

  <a class="contact-btn" id="contactBtn" href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
    <span id="contactLabel"></span>

// Gắn VCard cho Nút Lưu danh bạ (Góc trái)
function buildVCard(cfg) {
  const lines = ["BEGIN:VCARD", "VERSION:3.0", `FN:${cfg.fullName || cfg.name || ""}`, `N:;${cfg.name || ""};;;`];
  if (cfg.org) lines.push(`ORG:${cfg.org}`);
  if (cfg.role) lines.push(`TITLE:${cfg.role}`);
  (cfg.contactInfo || []).forEach((info) => {
    if (!info.value) return;
    if (info.type === "mail") lines.push(`EMAIL;TYPE=INTERNET:${info.value}`);
    if (info.type === "phone") lines.push(`TEL;TYPE=CELL:${info.value}`);
  });
  (cfg.links || []).forEach((link) => { if (link.url && link.url !== "#") lines.push(`URL;TYPE=${link.label || link.type}:${link.url}`); });
  lines.push("END:VCARD"); return lines.join("\r\n");
}
const saveBtnTop = document.getElementById("saveContactBtnTop");
saveBtnTop.href = "data:text/vcard;charset=utf-8," + encodeURIComponent(buildVCard(CONFIG));
saveBtnTop.setAttribute("target", "_blank"); 
saveBtnTop.setAttribute("rel", "noopener");

// Sửa lỗi nút Chia sẻ (Góc phải) kèm Fallback an toàn
document.getElementById("shareBtnTop").addEventListener("click", async (e) => {
  const shareData = { title: CONFIG.name, text: CONFIG.tagline, url: window.location.href };
  
  if (navigator.share) {
    try { 
      await navigator.share(shareData); 
      return; 
    } catch (err) {
      // Chỉ bỏ qua nếu người dùng chủ động tắt bảng Share
    }
  } 
  
  // Nếu máy tính không hỗ trợ share -> Fallback: Tự động copy link
  try {
    await navigator.clipboard.writeText(window.location.href);
    const btnSpan = e.currentTarget.querySelector("span");
    const oldText = btnSpan.textContent;
    btnSpan.textContent = "Đã copy link!";
    setTimeout(() => { btnSpan.textContent = oldText; }, 2000);
  } catch (err) {
    alert("Trình duyệt không hỗ trợ tự động chia sẻ. Bạn vui lòng copy thủ công thanh địa chỉ nhé!");
  }
});

const revealEls = document.querySelectorAll(".reveal");
const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach((entry) => { if (entry.isIntersecting) { entry.target.classList.add("is-visible"); revealObserver.unobserve(entry.target); } });
}, { threshold: 0.15, rootMargin: "0px 0px -40px 0px" });
revealEls.forEach((elx) => revealObserver.observe(elx));
